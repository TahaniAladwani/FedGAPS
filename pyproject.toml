[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "icde-federated-benchmark"
version = "0.1.0"
description = "Reproducible graph-aligned federated learning comparisons"
requires-python = ">=3.10"
dependencies = ["torch>=2.3", "torchvision>=0.18", "numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3", "Pillow>=10", "matplotlib>=3.7", "seaborn>=0.13", "tqdm>=4.66"]

[project.scripts]
icde = "icde.cli:main"

[tool.setuptools]
packages = ["icde", "reference"]

[tool.setuptools.package-data]
reference = ["*.md"]
